<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
    <style>

        body {
            background-color: #00070E;
            color: #E6F7FF;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background-color: #00244D;
            border-radius: 15px;
            text-align: center;
            min-width: 500px;
        }

        .content {
            padding: 20px;
        }

        h1 {
            font-family: 'Russo One', sans-serif;
            font-size: 40px;
            margin: 10px 0;
            color: #E6F7FF;
        }

        p {
            font-size: 16px;
            font-weight: 600;
            margin: 5px 0;
            color: #E6F7FF;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            background-color: #005B99;
            color: #E6F7FF !important;
            padding: 8px 30px;
            text-decoration: none !important;
            border-radius: 15px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: #1971B8;
        }
    </style>
</head>
<body>
<div class="card">
    <div th:insert="email-header :: header"></div>

    <div class="content">
        <h1 th:text="#{email.resetPassword.title}">Password reset requested</h1>
        <p th:text="#{email.resetPassword.body}">You have requested a password reset.</p>
        <p th:text="#{email.resetPassword.advice}">Please ignore this message if you didn't send the request.</p>
        <a class="btn" th:href="${resetPasswordUrl}" th:text="#{email.resetPassword.buttonLabel}">Reset Password</a>
    </div>
</div>
</body>
</html>
