<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
    <style>

        body {
            background-color: #00070E;
            color: #E6F7FF;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background-color: #00244D;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            min-width: 500px;
        }

        h1 {
            font-family: 'Russo One', sans-serif;
            font-size: 40px;
            margin: 10px 0;
            color: #E6F7FF;
        }

        p {
            font-size: 16px;
            font-weight: 600;
            margin: 5px 0;
            color: #E6F7FF;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            background-color: #005B99;
            color: #E6F7FF !important;
            padding: 8px 30px;
            text-decoration: none !important;
            border-radius: 15px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: #1971B8;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>Password reset requested</h1>
    <p th:text="'You have requested a password reset.'">Hello user,</p>
    <p th:text="'Please click the button below to continue. If you didn`t send this request, please ignore this message.'">
    </p>
    <a class="btn" th:href="${resetPasswordUrl}">Reset Password</a>
</div>
</body>
</html>
