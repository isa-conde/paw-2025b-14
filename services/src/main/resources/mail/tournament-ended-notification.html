<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tournament Created</title>
    <style>

        body {
            background-color: #00070E;
            color: #E6F7FF;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background-color: #00244D;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            min-width: 500px;
        }

        h1 {
            font-family: 'Russo One', sans-serif;
            font-size: 40px;
            margin: 10px 0;
            color: #E6F7FF;
        }

        p {
            font-size: 16px;
            font-weight: 600;
            margin: 5px 0;
            color: #E6F7FF;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            background-color: #005B99;
            color: #E6F7FF !important;
            padding: 8px 30px;
            text-decoration: none !important;
            border-radius: 15px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: #1971B8;
        }
    </style>
</head>
<body>
<div class="card">
    <h1 th:text="#{email.tournamentEndedNotification.title(${tournamentName})}">Tournament name has ended!</h1>
    <p th:text="#{email.tournamentEndedNotification.greeting(${userName})}">Hello user,</p>
    <p th:text="#{email.tournamentEndedNotification.body(${tournamentName})}">
        The tournament name you were participating in has ended. Click the button below to see how you did!
    </p>
    <a class="btn" th:href="${tournamentLink}" th:text="#{email.tournamentEndedNotification.buttonLabel}">View Tournament</a>
</div>
</body>
</html>
