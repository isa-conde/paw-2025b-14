<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tournament Joined</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Russo+One&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #00070E;
            color: #E6F7FF;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background-color: #00244D;
            border-radius: 15px;
            text-align: center;
            min-width: 500px;
        }

        .content {
            padding: 20px;
        }

        h1 {
            font-family: 'Russo One', sans-serif;
            font-size: 40px;
            margin: 10px 0;
            color: #E6F7FF;
        }

        p {
            font-size: 16px;
            font-weight: 600;
            margin: 5px 0;
            color: #E6F7FF;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            background-color: #005B99;
            color: #E6F7FF !important;
            padding: 8px 30px;
            text-decoration: none !important;
            border-radius: 15px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: #1971B8;
        }
    </style>
</head>
<body>
<div class="card">
    <div th:insert="email-header :: header"></div>

    <div class="content">
        <h1 th:text="#{email.tournamentStartedNotification.title(${tournamentName})}">The tournament has begun!</h1>
        <p th:text="#{email.tournamentStartedNotification.greeting(${userName})}">Hello user,</p>
        <p th:text="#{email.tournamentStartedNotification.body(${tournamentName})}">
            The tournament has begun! Click the button below to see your matches.
        </p>
        <br/>
        <p th:text="#{email.tournamentStartedNotification.serverName(${serverName})}">Server name</p>
        <p th:text="#{email.tournamentStartedNotification.serverPassword(${serverPassword})}">Server password</p>
        <div class="row" style="display: flex; align-items: center; gap: 6px;">
            <img alt="Discord"
                 src="cid:discord"
                 width="20" height="20"
                 style="display:block;border:0;outline:none;">

            <a th:href="${discordChannel}"
               th:text="#{email.tournamentStartedNotification.discord}"
               style="text-decoration: none; color: #5865F2; font-weight: bold;">
                Discord Channel
            </a>
        </div>
        <br/>
        <p th:text="#{email.tournamentStartedNotification.advice(${creatorMail})}">Contact the creator with their email.</p>
        <a class="btn" th:href="${tournamentLink}" th:text="#{email.tournamentStartedNotification.buttonLabel}">Go to Tournament</a>
    </div>
</div>
</body>
</html>
