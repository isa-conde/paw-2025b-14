openapi: 3.0.0
info:
  version: 1.0.0
  title: RankUp REST API
  description: |
    REST API for RankUp.

    Current pagination contract: paginated endpoints accept a zero-based `page`
    query parameter. When pagination links are emitted, they are returned in the
    standard `Link` response header with `self`, `first`, `last`, and, when
    applicable, `prev` and `next` relations.

    Current error contract: known API errors return an `ErrorDTO` JSON body with
    `status`, `error`, and `message`. Validation errors may also include a
    `details` object keyed by field or parameter name. Authentication failures
    return 401 JSON and authorization failures return 403 JSON. Jersey-generated
    media type errors such as 406 and 415 use the same schema.

    HATEOAS links that currently point to resources or filters without a REST
    controller are not documented as available endpoints here. Known pending
    resources/filters include user-created/user-participated tournament lists
    and user-participated match lists.
servers:
  - url: /api
tags:
  - name: users
    description: Manages users, sessions, verification, and password reset.
  - name: teams
    description: Manages teams and team members.
  - name: games
    description: Manages games and formats.
  - name: tournaments
    description: Manages tournaments, participants, matches, and status.
  - name: images
    description: Serves binary images referenced by DTO links.

paths:
  /users:
    get:
      tags: [users]
      summary: List users by name
      description: Requires `name`. Results are paginated with zero-based `page`.
      parameters:
        - in: query
          name: name
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: User list
          headers:
            Link:
              $ref: '#/components/headers/PaginationLink'
          content:
            application/vnd.user.list.v1+json:
              schema:
                $ref: '#/components/schemas/UserList'
        '400':
          $ref: '#/components/responses/BadRequestJson'
    post:
      tags: [users]
      summary: Create user
      requestBody:
        required: true
        content:
          application/vnd.user.create.v1+json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created. Current controller returns only `Location`.
          headers:
            Location:
              $ref: '#/components/headers/Location'
        '400':
          $ref: '#/components/responses/BadRequestJson'
        '409':
          $ref: '#/components/responses/ConflictJson'

  /users/{id}:
    get:
      tags: [users]
      summary: Get user
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User
          content:
            application/vnd.user.v1+json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFoundJson'

  /users/{id}/comments:
    get:
      tags: [users]
      summary: List comments received by a user
      description: Results are paginated with zero-based `page`.
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Comment list
          headers:
            Link:
              $ref: '#/components/headers/PaginationLink'
          content:
            application/vnd.comment.list.v1+json:
              schema:
                $ref: '#/components/schemas/CommentList'
        '400':
          $ref: '#/components/responses/BadRequestJson'
        '404':
          $ref: '#/components/responses/NotFoundJson'

  /users/{id}/accounts:
    get:
      tags: [users]
      summary: List user accounts
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User account list
          content:
            application/vnd.user-account.list.v1+json:
              schema:
                $ref: '#/components/schemas/UserAccountList'
        '400':
          $ref: '#/components/responses/BadRequestJson'
        '404':
          $ref: '#/components/responses/NotFoundJson'
    post:
      tags: [users]
      summary: Add an account to a user
      description: Only the authenticated owner of `{id}` may mutate accounts.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/vnd.user-account.create.v1+json:
            schema:
              $ref: '#/components/schemas/AddUserAccountRequest'
      responses:
        '201':
          description: Account added. Current controller returns the updated account list.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/vnd.user-account.list.v1+json:
              schema:
                $ref: '#/components/schemas/UserAccountList'
        '400':
          $ref: '#/components/responses/BadRequestJson'
        '401':
          $ref: '#/components/responses/UnauthorizedJson'
        '403':
          $ref: '#/components/responses/ForbiddenJson'
        '404':
          $ref: '#/components/responses/NotFoundJson'
        '409':
          $ref: '#/components/responses/ConflictJson'

  /users/{id}/accounts/{platform}:
    get:
      tags: [users]
      summary: Get user account by platform
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/PlatformPath'
      responses:
        '200':
          description: User account
          content:
            application/vnd.user-account.v1+json:
              schema:
                $ref: '#/components/schemas/UserAccount'
        '400':
          $ref: '#/components/responses/BadRequestJson'
        '404':
          $ref: '#/components/responses/NotFoundJson'
    delete:
      tags: [users]
      summary: Delete an account from a user
      description: Only the authenticated owner of `{id}` may mutate accounts.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/PlatformPath'
      responses:
        '204':
          description: Account deleted
        '400':
          $ref: '#/components/responses/BadRequestJson'
        '401':
          $ref: '#/components/responses/UnauthorizedJson'
        '403':
          $ref: '#/components/responses/ForbiddenJson'
        '404':
          $ref: '#/components/responses/NotFoundJson'

  /users/sessions:
    post:
      tags: [users]
      summary: Login user session
      requestBody:
        required: true
        content:
          application/vnd.user.login.v1+json:
            schema:
              $ref: '#/components/schemas/LoginUserRequest'
      responses:
        '200':
          description: Logged-in user
          headers:
            Authorization:
              $ref: '#/components/headers/Authorization'
          content:
            application/vnd.user.v1+json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequestJson'
        '401':
          $ref: '#/components/responses/UnauthorizedJson'
        '404':
          $ref: '#/components/responses/NotFoundJson'

  /users/verifications:
    post:
      tags: [users]
      summary: Resend verification email
      requestBody:
        required: true
        content:
          application/vnd.user.verification.v1+json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
      responses:
        '204':
          description: Verification email resent. Token is delivered out-of-band by email and is never exposed by this response.
        '400':
          $ref: '#/components/responses/BadRequestJson'
        '404':
          $ref: '#/components/responses/NotFoundJson'
    put:
      tags: [users]
      summary: Verify user
      requestBody:
        required: true
        content:
          application/vnd.user.verification-confirm.v1+json:
            schema:
              $ref: '#/components/schemas/ConfirmVerificationRequest'
      responses:
        '200':
          description: Verified user
          headers:
            Authorization:
              $ref: '#/components/headers/Authorization'
          content:
            application/vnd.user.v1+json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequestJson'
        '404':
          $ref: '#/components/responses/NotFoundJson'

  /users/password-requests:
    post:
      tags: [users]
      summary: Request password reset
      requestBody:
        required: true
        content:
          application/vnd.user.password-request.v1+json:
            schema:
              $ref: '#/components/schemas/RequestPasswordResetRequest'
      responses:
        '204':
          description: Password-reset email sent. Token is delivered out-of-band by email and is never exposed by this response.
        '400':
          $ref: '#/components/responses/BadRequestJson'
        '404':
          $ref: '#/components/responses/NotFoundJson'
    put:
      tags: [users]
      summary: Reset password
      requestBody:
        required: true
        content:
          application/vnd.user.password-reset.v1+json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset user
          headers:
            Authorization:
              $ref: '#/components/headers/Authorization'
          content:
            application/vnd.user.v1+json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequestJson'
        '404':
          $ref: '#/components/responses/NotFoundJson'

  /teams:
    get:
      tags: [teams]
      summary: Search teams
      description: |
        Supports either `name` or `userId`. `forTournament` can be combined only
        with `userId`. Name searches are paginated and may emit `Link` headers.
      parameters:
        - in: query
          name: name
          schema:
            type: string
        - in: query
          name: userId
          schema:
            type: integer
            format: int64
        - in: query
          name: forTournament
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Team list
          headers:
            Link:
              $ref: '#/components/headers/PaginationLink'
          content:
            application/vnd.team.list.v1+json:
              schema:
                $ref: '#/components/schemas/TeamList'
        '400':
          $ref: '#/components/responses/BadRequestJson'
    post:
      tags: [teams]
      summary: Create team
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/vnd.team.create.v1+json:
            schema:
              $ref: '#/components/schemas/CreateTeamRequest'
      responses:
        '201':
          description: Team created
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/vnd.team.v1+json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          $ref: '#/components/responses/BadRequestJson'
        '401':
          $ref: '#/components/responses/UnauthorizedJson'
        '403':
          $ref: '#/components/responses/ForbiddenJson'
        '409':
          $ref: '#/components/responses/ConflictJson'

  /teams/{id}:
    get:
      tags: [teams]
      summary: Get team
      parameters:
        - $ref: '#/components/parameters/TeamId'
      responses:
        '200':
          description: Team
          content:
            application/vnd.team.v1+json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          $ref: '#/components/responses/BadRequestJson'
        '404':
          $ref: '#/components/responses/NotFoundJson'
    put:
      tags: [teams]
      summary: Update team
      description: Only the authenticated team owner may update the team.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TeamId'
      requestBody:
        required: true
        content:
          application/vnd.team.update.v1+json:
            schema:
              $ref: '#/components/schemas/UpdateTeamRequest'
      responses:
        '200':
          description: Updated team
          content:
            application/vnd.team.v1+json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          $ref: '#/components/responses/BadRequestJson'
        '401':
          $ref: '#/components/responses/UnauthorizedJson'
        '403':
          $ref: '#/components/responses/ForbiddenJson'
        '404':
          $ref: '#/components/responses/NotFoundJson'
        '409':
          $ref: '#/components/responses/ConflictJson'

  /teams/{id}/members:
    get:
      tags: [teams]
      summary: Get team members
      parameters:
        - $ref: '#/components/parameters/TeamId'
      responses:
        '200':
          description: Team members
          content:
            application/vnd.user.list.v1+json:
              schema:
                $ref: '#/components/schemas/UserList'
        '400':
          $ref: '#/components/responses/BadRequestJson'
        '404':
          $ref: '#/components/responses/NotFoundJson'

  /games:
    get:
      tags: [games]
      summary: List or search games
      description: |
        `name` and `favouritedBy` are mutually exclusive. Listing/searching by
        `page` may emit pagination `Link` headers. Favourite lists are returned
        without pagination links by the current controller.
      parameters:
        - in: query
          name: name
          schema:
            type: string
        - in: query
          name: favouritedBy
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Game list
          headers:
            Link:
              $ref: '#/components/headers/PaginationLink'
          content:
            application/vnd.game.list.v1+json:
              schema:
                $ref: '#/components/schemas/GameList'
        '400':
          $ref: '#/components/responses/BadRequestJson'

  /games/{id}:
    get:
      tags: [games]
      summary: Get game
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Game
          content:
            application/vnd.game.v1+json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          $ref: '#/components/responses/BadRequestJson'
        '404':
          $ref: '#/components/responses/NotFoundJson'

  /games/{id}/formats:
    get:
      tags: [games]
      summary: List game formats
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Game format list
          content:
            application/vnd.game-format.list.v1+json:
              schema:
                $ref: '#/components/schemas/GameFormatList'
        '400':
          $ref: '#/components/responses/BadRequestJson'

  /games/{gameId}/formats/{formatId}:
    get:
      tags: [games]
      summary: Get game format
      parameters:
        - $ref: '#/components/parameters/GameIdForFormat'
        - $ref: '#/components/parameters/FormatId'
      responses:
        '200':
          description: Game format
          content:
            application/vnd.game-format.v1+json:
              schema:
                $ref: '#/components/schemas/GameFormat'
        '400':
          $ref: '#/components/responses/BadRequestJson'
        '404':
          $ref: '#/components/responses/NotFoundJson'

  /images/{id}:
    get:
      tags: [images]
      summary: Get image bytes
      description: Returns the stored image bytes. The controller infers common image content types from magic bytes and falls back to `application/octet-stream`.
      parameters:
        - $ref: '#/components/parameters/ImageId'
      responses:
        '200':
          description: Image bytes
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequestJson'
        '404':
          $ref: '#/components/responses/NotFoundJson'

  /tournaments:
    get:
      tags: [tournaments]
      summary: List tournaments
      description: Results are paginated with zero-based `page`.
      parameters:
        - in: query
          name: name
          schema:
            type: string
        - in: query
          name: gameId
          schema:
            type: integer
            format: int64
        - in: query
          name: region
          schema:
            $ref: '#/components/schemas/Region'
        - in: query
          name: elo
          schema:
            $ref: '#/components/schemas/Elo'
        - in: query
          name: startDate
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          schema:
            type: string
            format: date
        - in: query
          name: format
          schema:
            type: string
        - in: query
          name: structure
          schema:
            $ref: '#/components/schemas/Structure'
        - in: query
          name: genre
          schema:
            $ref: '#/components/schemas/Genre'
        - in: query
          name: playersPerTeam
          schema:
            type: integer
            minimum: 1
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Tournament list
          headers:
            Link:
              $ref: '#/components/headers/PaginationLink'
          content:
            application/vnd.tournament.list.v1+json:
              schema:
                $ref: '#/components/schemas/TournamentList'
        '400':
          $ref: '#/components/responses/BadRequestJson'
    post:
      tags: [tournaments]
      summary: Create tournament
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/vnd.tournament.create.v1+json:
            schema:
              $ref: '#/components/schemas/CreateTournamentRequest'
      responses:
        '201':
          description: Tournament created
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/vnd.tournament.v1+json:
              schema:
                $ref: '#/components/schemas/Tournament'
        '400':
          $ref: '#/components/responses/BadRequestJson'
        '401':
          $ref: '#/components/responses/UnauthorizedJson'
        '403':
          $ref: '#/components/responses/ForbiddenJson'
        '404':
          $ref: '#/components/responses/NotFoundJson'
        '409':
          $ref: '#/components/responses/ConflictJson'

  /tournaments/{id}:
    get:
      tags: [tournaments]
      summary: Get tournament
      parameters:
        - $ref: '#/components/parameters/TournamentId'
      responses:
        '200':
          description: Tournament
          content:
            application/vnd.tournament.v1+json:
              schema:
                $ref: '#/components/schemas/Tournament'
        '400':
          $ref: '#/components/responses/BadRequestJson'
        '404':
          $ref: '#/components/responses/NotFoundJson'
    put:
      tags: [tournaments]
      summary: Update tournament
      description: Only the authenticated tournament creator may update the tournament.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TournamentId'
      requestBody:
        required: true
        content:
          application/vnd.tournament.update.v1+json:
            schema:
              $ref: '#/components/schemas/UpdateTournamentRequest'
      responses:
        '200':
          description: Updated tournament
          content:
            application/vnd.tournament.v1+json:
              schema:
                $ref: '#/components/schemas/Tournament'
        '400':
          $ref: '#/components/responses/BadRequestJson'
        '404':
          $ref: '#/components/responses/NotFoundJson'
        '401':
          $ref: '#/components/responses/UnauthorizedJson'
        '403':
          $ref: '#/components/responses/ForbiddenJson'

  /tournaments/{id}/participants:
    get:
      tags: [tournaments]
      summary: Get tournament participants
      description: Not paginated in the current controller. Use `userId` to discover the stable participant resource for a user or one of their teams.
      parameters:
        - $ref: '#/components/parameters/TournamentId'
        - in: query
          name: teamSize
          schema:
            type: integer
            minimum: 1
        - in: query
          name: userId
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Participant list
          content:
            application/vnd.participant.list.v1+json:
              schema:
                $ref: '#/components/schemas/ParticipantList'
        '400':
          $ref: '#/components/responses/BadRequestJson'

  /tournaments/{id}/rules:
    get:
      tags: [tournaments]
      summary: Get tournament rules PDF
      parameters:
        - $ref: '#/components/parameters/TournamentId'
      responses:
        '200':
          description: Tournament rules PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequestJson'
        '404':
          $ref: '#/components/responses/NotFoundJson'

  /tournaments/{id}/participants/users:
    post:
      tags: [tournaments]
      summary: Join tournament as user
      description: Joins the authenticated Bearer-token user; no user id is accepted in the request body.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TournamentId'
      responses:
        '204':
          description: Joined
        '400':
          $ref: '#/components/responses/BadRequestJson'
        '401':
          $ref: '#/components/responses/UnauthorizedJson'
        '403':
          $ref: '#/components/responses/ForbiddenJson'
        '404':
          $ref: '#/components/responses/NotFoundJson'
        '409':
          $ref: '#/components/responses/ConflictJson'

  /tournaments/{id}/participants/teams:
    post:
      tags: [tournaments]
      summary: Join tournament as team
      description: Only the authenticated owner of `teamId` may enroll that team.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TournamentId'
      requestBody:
        required: true
        content:
          application/vnd.tournament.join-team.v1+json:
            schema:
              $ref: '#/components/schemas/JoinTournamentTeamRequest'
      responses:
        '204':
          description: Joined
        '400':
          $ref: '#/components/responses/BadRequestJson'
        '401':
          $ref: '#/components/responses/UnauthorizedJson'
        '403':
          $ref: '#/components/responses/ForbiddenJson'
        '404':
          $ref: '#/components/responses/NotFoundJson'
        '409':
          $ref: '#/components/responses/ConflictJson'

  /tournaments/{id}/participants/{participantId}:
    get:
      tags: [tournaments]
      summary: Get tournament participant
      parameters:
        - $ref: '#/components/parameters/TournamentId'
        - $ref: '#/components/parameters/ParticipantId'
      responses:
        '200':
          description: Participant
          content:
            application/vnd.participant.v1+json:
              schema:
                $ref: '#/components/schemas/Participant'
        '400':
          $ref: '#/components/responses/BadRequestJson'
        '404':
          $ref: '#/components/responses/NotFoundJson'
    delete:
      tags: [tournaments]
      summary: Remove participant
      description: Tournament creators may remove any participant. The owner of a participant may leave through this stable participant resource while business rules allow it.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TournamentId'
        - $ref: '#/components/parameters/ParticipantId'
      responses:
        '204':
          description: Removed
        '400':
          $ref: '#/components/responses/BadRequestJson'
        '401':
          $ref: '#/components/responses/UnauthorizedJson'
        '403':
          $ref: '#/components/responses/ForbiddenJson'
        '404':
          $ref: '#/components/responses/NotFoundJson'
        '409':
          $ref: '#/components/responses/ConflictJson'

  /tournaments/{id}/matches:
    get:
      tags: [tournaments]
      summary: Get tournament matches grouped by stage
      description: Not paginated in the current controller.
      parameters:
        - $ref: '#/components/parameters/TournamentId'
        - in: query
          name: group
          schema:
            type: integer
      responses:
        '200':
          description: Match stages
          content:
            application/vnd.matchstagelist.v1+json:
              schema:
                $ref: '#/components/schemas/MatchStageList'
        '400':
          $ref: '#/components/responses/BadRequestJson'

  /tournaments/{id}/matches/{matchId}:
    get:
      tags: [tournaments]
      summary: Get tournament match
      parameters:
        - $ref: '#/components/parameters/TournamentId'
        - $ref: '#/components/parameters/MatchId'
      responses:
        '200':
          description: Match
          content:
            application/vnd.match.v1+json:
              schema:
                $ref: '#/components/schemas/Match'
        '400':
          $ref: '#/components/responses/BadRequestJson'
        '404':
          $ref: '#/components/responses/NotFoundJson'

  /tournaments/{id}/matches/{matchId}/results:
    put:
      tags: [tournaments]
      summary: Set match results
      description: Only the authenticated tournament creator may set match results.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TournamentId'
        - $ref: '#/components/parameters/MatchId'
      requestBody:
        required: true
        content:
          application/vnd.match.results.v1+json:
            schema:
              $ref: '#/components/schemas/SetMatchResultsRequest'
      responses:
        '204':
          description: Updated
        '400':
          $ref: '#/components/responses/BadRequestJson'
        '401':
          $ref: '#/components/responses/UnauthorizedJson'
        '403':
          $ref: '#/components/responses/ForbiddenJson'
        '404':
          $ref: '#/components/responses/NotFoundJson'
        '409':
          $ref: '#/components/responses/ConflictJson'

  /tournaments/{id}/status:
    put:
      tags: [tournaments]
      summary: Update tournament status
      description: Only the authenticated tournament creator may update tournament status.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TournamentId'
      requestBody:
        required: true
        content:
          application/vnd.tournament.status.v1+json:
            schema:
              $ref: '#/components/schemas/TournamentStatusRequest'
      responses:
        '200':
          description: Updated tournament status
          content:
            application/vnd.tournament.v1+json:
              schema:
                $ref: '#/components/schemas/Tournament'
        '400':
          $ref: '#/components/responses/BadRequestJson'
        '404':
          $ref: '#/components/responses/NotFoundJson'
        '401':
          $ref: '#/components/responses/UnauthorizedJson'
        '403':
          $ref: '#/components/responses/ForbiddenJson'
        '409':
          $ref: '#/components/responses/ConflictJson'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  headers:
    Authorization:
      description: JWT returned by session, verification, and password-reset flows.
      schema:
        type: string
    Location:
      description: Absolute URI of the created resource.
      schema:
        type: string
        format: uri
    PaginationLink:
      description: RFC 8288 pagination links with `self`, `first`, `last`, and optional `prev`/`next`.
      schema:
        type: string

  parameters:
    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Zero-based page index.
    UserId:
      in: path
      name: id
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    UserIdPath:
      in: path
      name: userId
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    TeamId:
      in: path
      name: id
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    GameId:
      in: path
      name: id
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ImageId:
      in: path
      name: id
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    GameIdForFormat:
      in: path
      name: gameId
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    FormatId:
      in: path
      name: formatId
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    TournamentId:
      in: path
      name: id
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ParticipantId:
      in: path
      name: participantId
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    MatchId:
      in: path
      name: matchId
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    PlatformPath:
      in: path
      name: platform
      required: true
      schema:
        $ref: '#/components/schemas/Platform'

  responses:
    BadRequestJson:
      description: Invalid request syntax, parameters, DTO validation, or business input.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFoundJson:
      description: Requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ConflictJson:
      description: Request conflicts with the current resource state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotAcceptableJson:
      description: Requested response media type is not acceptable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaTypeJson:
      description: Request media type is unsupported.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnauthorizedJson:
      description: Missing, empty, or invalid Bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ForbiddenJson:
      description: Authenticated user does not have the required permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Link:
      type: object
      properties:
        rel:
          type: string
        href:
          type: string
          format: uri
      required: [rel, href]

    Error:
      type: object
      properties:
        status:
          type: integer
          example: 404
        error:
          type: string
          example: Not Found
        message:
          type: string
          example: Tournament not found
        details:
          type: object
          additionalProperties:
            type: string
          description: Optional validation details keyed by field or parameter.
          example:
            name: must not be blank
      required: [status, error, message]

    Region:
      type: string
      enum: [NA, LAS, LAN, BR, EUW, EUNE, OCE, ASIA]
    Elo:
      type: string
      enum: [LOW, MID, HIGH, FREE]
    Structure:
      type: string
      enum: [ELIMINATION, LEAGUE, HYBRID]
    Genre:
      type: string
      enum: [MOBA, FPS, Fighting, TPS, BattleRoyale, RTS, Sports, DGC, MOBILE]
    Platform:
      type: string
      enum: [DISCORD, STEAM, EPIC_GAMES, RIOT_GAMES, PLAYSTATION, XBOX, NINTENDO, BATTLE_NET, UBISOFT_CONNECT, ROCKSTAR]

    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        verified:
          type: boolean
        bio:
          type: string
        rating:
          type: number
          format: float
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'

    Comment:
      type: object
      properties:
        id:
          type: integer
          format: int64
        comment:
          type: string
        createdAt:
          type: string
          format: date-time
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'

    UserAccount:
      type: object
      properties:
        platform:
          $ref: '#/components/schemas/Platform'
        username:
          type: string
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'

    AddUserAccountRequest:
      type: object
      properties:
        platform:
          $ref: '#/components/schemas/Platform'
        username:
          type: string
          maxLength: 100
      required: [platform, username]

    CreateUserRequest:
      type: object
      properties:
        username:
          type: string
          maxLength: 31
        email:
          type: string
          format: email
        password:
          type: string
        repeatPassword:
          type: string
      required: [username, email, password, repeatPassword]

    ResendVerificationRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required: [email]

    ConfirmVerificationRequest:
      type: object
      properties:
        token:
          type: integer
          format: int64
          minimum: 1
      required: [token]

    RequestPasswordResetRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required: [email]

    ResetPasswordRequest:
      type: object
      properties:
        token:
          type: integer
          format: int64
          minimum: 1
        password:
          type: string
      required: [token, password]

    LoginUserRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required: [username, password]

    Team:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'

    CreateTeamRequest:
      type: object
      properties:
        name:
          type: string
        profilePictureBase64:
          type: string
        bannerBase64:
          type: string
        members:
          type: array
          items:
            type: string
      required: [name]

    UpdateTeamRequest:
      type: object
      properties:
        name:
          type: string
        profilePictureBase64:
          type: string
        bannerBase64:
          type: string
        members:
          type: array
          items:
            type: string
      required: [name]

    Game:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        genre:
          type: string
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'

    GameFormat:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        playersPerTeam:
          type: integer
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'

    Tournament:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        region:
          type: string
        elo:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        format:
          type: string
        structure:
          type: string
        maxParticipants:
          type: integer
        openInscriptions:
          type: boolean
        finished:
          type: boolean
        groupStage:
          type: boolean
        tournamentStarted:
          type: boolean
        rating:
          type: number
          format: float
        serverName:
          type: string
        discordChannel:
          type: string
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'

    CreateTournamentRequest:
      type: object
      properties:
        name:
          type: string
        gameId:
          type: integer
          format: int64
          minimum: 1
        region:
          $ref: '#/components/schemas/Region'
        elo:
          $ref: '#/components/schemas/Elo'
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        structure:
          $ref: '#/components/schemas/Structure'
        maxParticipants:
          type: integer
          minimum: 1
        formatId:
          type: integer
          format: int64
          minimum: 1
        imageBase64:
          type: string
        rulesBase64:
          type: string
        serverName:
          type: string
        serverPassword:
          type: string
        discordChannel:
          type: string
      required: [name, gameId, region, elo, startDate, endDate, structure, maxParticipants, formatId]

    UpdateTournamentRequest:
      type: object
      properties:
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        maxParticipants:
          type: integer
          minimum: 1
        imageBase64:
          type: string
        rulesBase64:
          type: string
        serverName:
          type: string
        serverPassword:
          type: string
        discordChannel:
          type: string
      required: [name]

    TournamentStatusRequest:
      type: object
      properties:
        tournamentStarted:
          type: boolean
          description: May only transition to true in the current controller.
        openInscriptions:
          type: boolean
          description: May only transition to false in the current controller.

    Participant:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        points:
          type: integer
        scoreDifference:
          type: integer
          nullable: true
        groupNumber:
          type: integer
          nullable: true
        hasRated:
          type: boolean
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'

    JoinTournamentTeamRequest:
      type: object
      properties:
        teamId:
          type: integer
          format: int64
          minimum: 1
        members:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64
            minimum: 1
      required: [teamId, members]

    Match:
      type: object
      properties:
        id:
          type: integer
          format: int64
        localScore:
          type: integer
          nullable: true
        visitorScore:
          type: integer
          nullable: true
        winner:
          type: integer
          nullable: true
        stage:
          type: integer
          nullable: true
        groupStage:
          type: boolean
          nullable: true
        date:
          type: string
          format: date
          nullable: true
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'

    MatchStage:
      type: object
      properties:
        stage:
          type: integer
        matches:
          type: array
          items:
            $ref: '#/components/schemas/Match'

    SetMatchResultsRequest:
      type: object
      properties:
        localScore:
          type: integer
        visitorScore:
          type: integer
      required: [localScore, visitorScore]

    UserList:
      type: array
      items:
        $ref: '#/components/schemas/User'
    TeamList:
      type: array
      items:
        $ref: '#/components/schemas/Team'
    GameList:
      type: array
      items:
        $ref: '#/components/schemas/Game'
    GameFormatList:
      type: array
      items:
        $ref: '#/components/schemas/GameFormat'
    TournamentList:
      type: array
      items:
        $ref: '#/components/schemas/Tournament'
    ParticipantList:
      type: array
      items:
        $ref: '#/components/schemas/Participant'
    MatchStageList:
      type: array
      items:
        $ref: '#/components/schemas/MatchStage'
    CommentList:
      type: array
      items:
        $ref: '#/components/schemas/Comment'
    UserAccountList:
      type: array
      items:
        $ref: '#/components/schemas/UserAccount'
